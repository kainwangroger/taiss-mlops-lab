global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-fraude
    metrics_path: /metrics
    static_configs:
      # « api » est le nom du service dans docker-compose.yml : c'est ainsi que
      # Prometheus le résout. Si votre tableau de bord reste vide, c'est très
      # souvent ce nom qui est faux.
      - targets: ["api:8000"]
        labels:
          service: detection-fraude
